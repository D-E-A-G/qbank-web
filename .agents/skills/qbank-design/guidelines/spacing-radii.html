<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);font:var(--text-subhead);color:var(--text-1)}*{box-sizing:border-box}.row{display:flex;gap:10px}.lbl{font:var(--weight-semibold) var(--size-caption-1)/var(--lh-caption-1) var(--font-mono);color:var(--text-1)}.sub{font:var(--text-caption-2);color:var(--text-3);font-family:var(--font-mono)}</style></head><body><div class="row" style="gap:16px"><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:64px;background:var(--surface);border-radius:var(--radius-xs);box-shadow:inset 0 0 0 1px var(--separator-strong)"></div><div class="lbl">radius-xs · 6</div><div class="sub">checkbox</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:64px;background:var(--surface);border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px var(--separator-strong)"></div><div class="lbl">radius-sm · 10</div><div class="sub">button, option</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:64px;background:var(--surface);border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--separator-strong)"></div><div class="lbl">radius-md · 14</div><div class="sub">card, list, tile</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:64px;background:var(--surface);border-radius:var(--radius-lg);box-shadow:inset 0 0 0 1px var(--separator-strong)"></div><div class="lbl">radius-lg · 20</div><div class="sub">sheet</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:64px;background:var(--surface);border-radius:var(--radius-pill);box-shadow:inset 0 0 0 1px var(--separator-strong)"></div><div class="lbl">radius-pill · 999</div><div class="sub">chip, timer</div></div></div></body></html>
