<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);font:var(--text-subhead);color:var(--text-1)}*{box-sizing:border-box}.row{display:flex;gap:10px}.lbl{font:var(--weight-semibold) var(--size-caption-1)/var(--lh-caption-1) var(--font-mono);color:var(--text-1)}.sub{font:var(--text-caption-2);color:var(--text-3);font-family:var(--font-mono)}</style></head><body><div class="row"><div data-theme="light" style="flex:1;background:var(--bg);padding:18px;border-radius:12px;display:flex;gap:14px"><div style="flex:1;height:70px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-card), inset 0 0 0 .5px var(--separator);display:flex;align-items:flex-end;padding:8px"><span class="lbl">Card</span></div><div style="flex:1;height:70px;border-radius:14px;background:var(--surface-raised);box-shadow:var(--shadow-raised);display:flex;align-items:flex-end;padding:8px"><span class="lbl">Raised</span></div><div style="flex:1;height:70px;border-radius:14px;background:var(--surface-raised);box-shadow:var(--shadow-popover);display:flex;align-items:flex-end;padding:8px"><span class="lbl">Popover</span></div></div><div data-theme="dark" style="flex:1;background:var(--bg);padding:18px;border-radius:12px;display:flex;gap:14px"><div style="flex:1;height:70px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-card), inset 0 0 0 .5px var(--separator);display:flex;align-items:flex-end;padding:8px"><span class="lbl">Card</span></div><div style="flex:1;height:70px;border-radius:14px;background:var(--surface-raised);box-shadow:var(--shadow-raised);display:flex;align-items:flex-end;padding:8px"><span class="lbl">Raised</span></div><div style="flex:1;height:70px;border-radius:14px;background:var(--surface-raised);box-shadow:var(--shadow-popover);display:flex;align-items:flex-end;padding:8px"><span class="lbl">Popover</span></div></div></div></body></html>
