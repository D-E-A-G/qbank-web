<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Calm easing, no bounce, no celebration. Respect Reduce Motion" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);font:var(--text-subhead);color:var(--text-1)}*{box-sizing:border-box}.row{display:flex;gap:10px}.lbl{font:var(--weight-semibold) var(--size-caption-1)/var(--lh-caption-1) var(--font-mono);color:var(--text-1)}.sub{font:var(--text-caption-2);color:var(--text-3);font-family:var(--font-mono)}.m{flex:1;padding:12px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--separator)}.t{height:6px;border-radius:3px;background:var(--surface-sunken);margin-top:10px;overflow:hidden}.t span{display:block;height:100%;width:30%;background:var(--tint);border-radius:3px;animation:mv 1.8s infinite alternate}@keyframes mv{to{transform:translateX(233%)}}</style></head><body><div class="row"><div class="m"><div class="lbl">100ms · press</div><div class="sub">--dur-instant · --ease-standard</div><div class="t"><span style="animation-duration:calc(var(--dur-instant) * 4);animation-timing-function:var(--ease-standard)"></span></div></div><div class="m"><div class="lbl">180ms · select / check</div><div class="sub">--dur-quick · --ease-standard</div><div class="t"><span style="animation-duration:calc(var(--dur-quick) * 4);animation-timing-function:var(--ease-standard)"></span></div></div><div class="m"><div class="lbl">260ms · feedback reveal</div><div class="sub">--dur-standard · --ease-out</div><div class="t"><span style="animation-duration:calc(var(--dur-standard) * 4);animation-timing-function:var(--ease-out)"></span></div></div><div class="m"><div class="lbl">420ms · sheet present</div><div class="sub">--dur-sheet · --ease-sheet</div><div class="t"><span style="animation-duration:calc(var(--dur-sheet) * 4);animation-timing-function:var(--ease-sheet)"></span></div></div></div></body></html>
