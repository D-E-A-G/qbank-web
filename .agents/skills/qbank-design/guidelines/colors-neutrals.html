<!-- @dsCard group="Colors" viewport="700x150" name="Paper neutrals" subtitle="Warm paper scale shared by both palettes; base for surfaces and text in both modes" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);font:var(--text-subhead);color:var(--text-1)}*{box-sizing:border-box}.row{display:flex;gap:6px}.lbl{font:var(--weight-semibold) var(--size-caption-1)/var(--lh-caption-1) var(--font-mono);color:var(--text-1)}.sub{font:var(--text-caption-2);color:var(--text-3)}.sw{height:64px;border-radius:8px;box-shadow:inset 0 0 0 .5px var(--separator)}.c{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.k{font:var(--weight-semibold) var(--size-caption-1)/var(--lh-caption-1) var(--font-mono);color:var(--text-2);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}</style></head><body><div class="row"><div class="c"><div class="sw" style="background:var(--paper-0)"></div><div class="lbl">0</div><div class="sub" data-v="--paper-0"></div></div><div class="c"><div class="sw" style="background:var(--paper-50)"></div><div class="lbl">50</div><div class="sub" data-v="--paper-50"></div></div><div class="c"><div class="sw" style="background:var(--paper-100)"></div><div class="lbl">100</div><div class="sub" data-v="--paper-100"></div></div><div class="c"><div class="sw" style="background:var(--paper-200)"></div><div class="lbl">200</div><div class="sub" data-v="--paper-200"></div></div><div class="c"><div class="sw" style="background:var(--paper-300)"></div><div class="lbl">300</div><div class="sub" data-v="--paper-300"></div></div><div class="c"><div class="sw" style="background:var(--paper-400)"></div><div class="lbl">400</div><div class="sub" data-v="--paper-400"></div></div><div class="c"><div class="sw" style="background:var(--paper-500)"></div><div class="lbl">500</div><div class="sub" data-v="--paper-500"></div></div><div class="c"><div class="sw" style="background:var(--paper-600)"></div><div class="lbl">600</div><div class="sub" data-v="--paper-600"></div></div><div class="c"><div class="sw" style="background:var(--paper-700)"></div><div class="lbl">700</div><div class="sub" data-v="--paper-700"></div></div><div class="c"><div class="sw" style="background:var(--paper-800)"></div><div class="lbl">800</div><div class="sub" data-v="--paper-800"></div></div><div class="c"><div class="sw" style="background:var(--paper-850)"></div><div class="lbl">850</div><div class="sub" data-v="--paper-850"></div></div><div class="c"><div class="sw" style="background:var(--paper-900)"></div><div class="lbl">900</div><div class="sub" data-v="--paper-900"></div></div><div class="c"><div class="sw" style="background:var(--paper-950)"></div><div class="lbl">950</div><div class="sub" data-v="--paper-950"></div></div></div><script>document.querySelectorAll('[data-v]').forEach(e=>{e.textContent=getComputedStyle(e).getPropertyValue(e.dataset.v).trim()})</script></body></html>
