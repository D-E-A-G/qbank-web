<!-- @dsCard group="Colors" viewport="700x550" name="Accent palettes" subtitle="One accent at a time: data-palette="dusk" (default), "pink", "ink" or "earth". --tint = 600 light / 400 (pink) · 300 (ink) dark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);font:var(--text-subhead);color:var(--text-1)}*{box-sizing:border-box}.row{display:flex;gap:6px}.lbl{font:var(--weight-semibold) var(--size-caption-1)/var(--lh-caption-1) var(--font-mono);color:var(--text-1)}.sub{font:var(--text-caption-2);color:var(--text-3)}.sw{height:44px;border-radius:8px;box-shadow:inset 0 0 0 .5px var(--separator)}.c{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.k{font:var(--weight-semibold) var(--size-caption-1)/var(--lh-caption-1) var(--font-mono);color:var(--text-2);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}</style></head><body><div data-palette="pink"><div class="k">Pink</div><div class="row"><div class="c"><div class="sw" style="background:var(--accent-50)"></div><div class="lbl">50</div><div class="sub" data-v="--accent-50"></div></div><div class="c"><div class="sw" style="background:var(--accent-100)"></div><div class="lbl">100</div><div class="sub" data-v="--accent-100"></div></div><div class="c"><div class="sw" style="background:var(--accent-300)"></div><div class="lbl">300</div><div class="sub" data-v="--accent-300"></div></div><div class="c"><div class="sw" style="background:var(--accent-400)"></div><div class="lbl">400</div><div class="sub" data-v="--accent-400"></div></div><div class="c"><div class="sw" style="background:var(--accent-500)"></div><div class="lbl">500</div><div class="sub" data-v="--accent-500"></div></div><div class="c"><div class="sw" style="background:var(--accent-600)"></div><div class="lbl">600 · tint light</div><div class="sub" data-v="--accent-600"></div></div><div class="c"><div class="sw" style="background:var(--accent-700)"></div><div class="lbl">700</div><div class="sub" data-v="--accent-700"></div></div><div class="c"><div class="sw" style="background:var(--accent-900)"></div><div class="lbl">900</div><div class="sub" data-v="--accent-900"></div></div></div></div><div style="height:16px"></div><div data-palette="earth" style="order:3"><div class="k">Earth</div><div class="row"><div class="c"><div class="sw" style="background:var(--accent-50)"></div><div class="lbl">50</div><div class="sub" data-v="--accent-50"></div></div><div style="height:16px"></div><div data-palette="dusk"><div class="k">Dusk · default</div><div class="row"><div class="c"><div class="sw" style="background:var(--accent-50)"></div><div class="lbl">50</div><div class="sub" data-v="--accent-50"></div></div></div><div style="height:16px"></div><div data-palette="ink"><div class="k">Ink</div><div class="row"><div class="c"><div class="sw" style="background:var(--accent-50)"></div><div class="lbl">50</div><div class="sub" data-v="--accent-50"></div></div><div class="c"><div class="sw" style="background:var(--accent-100)"></div><div class="lbl">100</div><div class="sub" data-v="--accent-100"></div></div><div class="c"><div class="sw" style="background:var(--accent-300)"></div><div class="lbl">300</div><div class="sub" data-v="--accent-300"></div></div><div class="c"><div class="sw" style="background:var(--accent-400)"></div><div class="lbl">400</div><div class="sub" data-v="--accent-400"></div></div><div class="c"><div class="sw" style="background:var(--accent-500)"></div><div class="lbl">500</div><div class="sub" data-v="--accent-500"></div></div><div class="c"><div class="sw" style="background:var(--accent-600)"></div><div class="lbl">600 · tint light</div><div class="sub" data-v="--accent-600"></div></div><div class="c"><div class="sw" style="background:var(--accent-700)"></div><div class="lbl">700</div><div class="sub" data-v="--accent-700"></div></div><div class="c"><div class="sw" style="background:var(--accent-900)"></div><div class="lbl">900</div><div class="sub" data-v="--accent-900"></div></div></div></div><script>document.querySelectorAll('[data-v]').forEach(e=>{e.textContent=getComputedStyle(e).getPropertyValue(e.dataset.v).trim()})</script></body></html>
