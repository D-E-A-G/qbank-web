<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);font:var(--text-subhead);color:var(--text-1)}*{box-sizing:border-box}.row{display:flex;gap:10px}.lbl{font:var(--weight-semibold) var(--size-caption-1)/var(--lh-caption-1) var(--font-mono);color:var(--text-1)}.sub{font:var(--text-caption-2);color:var(--text-3);font-family:var(--font-mono)}</style></head><body><div class="row"><div data-theme="light" style="flex:1;padding:14px;background:var(--bg);border-radius:12px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 .5px var(--separator-strong)">
<div style="display:flex;align-items:center;gap:10px"><span style="width:44px;height:26px;border-radius:6px;background:var(--bg);box-shadow:inset 0 0 0 .5px var(--separator-strong)"></span><span class="lbl">--bg</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:44px;height:26px;border-radius:6px;background:var(--bg-sidebar);box-shadow:inset 0 0 0 .5px var(--separator-strong)"></span><span class="lbl">--bg-sidebar</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:44px;height:26px;border-radius:6px;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--separator-strong)"></span><span class="lbl">--surface</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:44px;height:26px;border-radius:6px;background:var(--surface-raised);box-shadow:inset 0 0 0 .5px var(--separator-strong)"></span><span class="lbl">--surface-raised</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:44px;height:26px;border-radius:6px;background:var(--surface-sunken);box-shadow:inset 0 0 0 .5px var(--separator-strong)"></span><span class="lbl">--surface-sunken</span></div></div><div data-theme="dark" style="flex:1;padding:14px;background:var(--bg);border-radius:12px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 .5px var(--separator-strong)">
<div style="display:flex;align-items:center;gap:10px"><span style="width:44px;height:26px;border-radius:6px;background:var(--bg);box-shadow:inset 0 0 0 .5px var(--separator-strong)"></span><span class="lbl">--bg</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:44px;height:26px;border-radius:6px;background:var(--bg-sidebar);box-shadow:inset 0 0 0 .5px var(--separator-strong)"></span><span class="lbl">--bg-sidebar</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:44px;height:26px;border-radius:6px;background:var(--surface);box-shadow:inset 0 0 0 .5px var(--separator-strong)"></span><span class="lbl">--surface</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:44px;height:26px;border-radius:6px;background:var(--surface-raised);box-shadow:inset 0 0 0 .5px var(--separator-strong)"></span><span class="lbl">--surface-raised</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:44px;height:26px;border-radius:6px;background:var(--surface-sunken);box-shadow:inset 0 0 0 .5px var(--separator-strong)"></span><span class="lbl">--surface-sunken</span></div></div></div></body></html>
