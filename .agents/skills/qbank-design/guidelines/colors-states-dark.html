<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);font:var(--text-subhead);color:var(--text-1)}*{box-sizing:border-box}.row{display:flex;gap:10px}.lbl{font:var(--weight-semibold) var(--size-caption-1)/var(--lh-caption-1) var(--font-mono);color:var(--text-1)}.sub{font:var(--text-caption-2);color:var(--text-3);font-family:var(--font-mono)}.st{flex:1;display:flex;flex-direction:column;gap:8px}.chip{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:10px;font:var(--weight-semibold) var(--size-subhead)/1 var(--font-ui)}.dots{display:flex;gap:4px}.dots span{flex:1;height:18px;border-radius:4px}</style></head><body><div data-theme="dark" style="margin:-20px;padding:20px;background:var(--bg);min-height:190px"><div class="row"><div class="st"><div class="chip" style="background:var(--correct-soft);color:var(--correct);box-shadow:inset 0 0 0 1px var(--correct-border)">Correct</div><div class="dots"><span style="background:var(--correct)"></span><span style="background:var(--correct-border)"></span><span style="background:var(--correct-soft);box-shadow:inset 0 0 0 .5px var(--separator)"></span></div><div class="sub" style="color:var(--text-3)">--correct · -border · -soft</div></div><div class="st"><div class="chip" style="background:var(--partial-soft);color:var(--partial);box-shadow:inset 0 0 0 1px var(--partial-border)">Partly right</div><div class="dots"><span style="background:var(--partial)"></span><span style="background:var(--partial-border)"></span><span style="background:var(--partial-soft);box-shadow:inset 0 0 0 .5px var(--separator)"></span></div><div class="sub" style="color:var(--text-3)">--partial · -border · -soft</div></div><div class="st"><div class="chip" style="background:var(--wrong-soft);color:var(--wrong);box-shadow:inset 0 0 0 1px var(--wrong-border)">Not correct</div><div class="dots"><span style="background:var(--wrong)"></spa
