<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg);font:var(--text-subhead);color:var(--text-1)}*{box-sizing:border-box}.row{display:flex;gap:10px}.lbl{font:var(--weight-semibold) var(--size-caption-1)/var(--lh-caption-1) var(--font-mono);color:var(--text-1)}.sub{font:var(--text-caption-2);color:var(--text-3);font-family:var(--font-mono)}.dev{background:var(--surface-sunken);border-radius:12px;box-shadow:inset 0 0 0 1px var(--separator-strong);display:flex;overflow:hidden;position:relative}.sb{background:var(--bg-sidebar);border-right:1px solid var(--separator-strong)}.col{background:var(--surface);margin:10px auto;border-radius:6px}.cap{font:var(--text-caption);color:var(--text-3);margin-top:6px}</style></head><body><div class="row" style="align-items:flex-end;gap:24px"><div><div class="dev" style="width:80px;height:160px;flex-direction:column"><div class="col" style="width:64px;flex:1"></div><div style="height:16px;background:var(--material);border-top:1px solid var(--separator-strong)"></div></div><div class="cap">iPhone · 16 gutters · tabs</div></div><div><div class="dev" style="width:230px;height:160px"><div class="sb" style="width:70px"></div><div class="col" style="flex:1;margin:10px 16px"></div></div><div class="cap">iPad · 280 sidebar · 24 gutters</div></div><div><div class="dev" style="width:300px;height:180px"><div class="sb" style="width:70px"></div><div style="flex:1;display:flex;justify-content:center"><div class="col" style="width:150px"></div></div></div><div class="cap">Mac · sidebar · 720 max reading column</div></div></div></body></html>
